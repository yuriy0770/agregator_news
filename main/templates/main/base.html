<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Новостной агрегатор{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        * {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0e1a;
            color: #e0e8f0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== ЗВЁЗДНЫЙ ФОН ===== */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at 20% 50%, #0d1b2a, #0a0e1a);
            overflow: hidden;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
            opacity: 0.3;
        }

        @keyframes twinkle {
            0% { opacity: 0.1; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.3); }
        }

        /* ===== НАВИГАЦИЯ ===== */
        .navbar {
            background: rgba(10, 14, 30, 0.75) !important;
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(0, 229, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
            background: linear-gradient(135deg, #00e5ff, #7c3aed);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 40px rgba(0, 229, 255, 0.15);
        }

        .navbar-brand i {
            color: #00e5ff;
            margin-right: 8px;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.7) !important;
            transition: all 0.3s ease;
            font-weight: 500;
            position: relative;
        }

        .nav-link:hover {
            color: #00e5ff !important;
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%) scaleX(0);
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, #00e5ff, #7c3aed);
            transition: transform 0.3s ease;
        }

        .nav-link:hover::after {
            transform: translateX(-50%) scaleX(1);
        }

        .btn-neon {
            background: transparent;
            border: 1px solid #00e5ff;
            color: #00e5ff;
            transition: all 0.3s ease;
            border-radius: 30px;
            padding: 8px 24px;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
        }

        .btn-neon:hover {
            background: #00e5ff;
            color: #0a0e1a;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.3);
            transform: translateY(-2px);
        }

        .btn-neon-outline {
            background: transparent;
            border: 1px solid rgba(0, 229, 255, 0.3);
            color: rgba(255, 255, 255, 0.7);
            transition: all 0.3s ease;
            border-radius: 30px;
            padding: 8px 24px;
            font-weight: 500;
        }

        .btn-neon-outline:hover {
            border-color: #00e5ff;
            color: #00e5ff;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.1);
        }

        /* ===== КАРТОЧКИ ===== */
        .card-neon {
            background: rgba(10, 14, 30, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 229, 255, 0.08);
            border-radius: 20px;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            overflow: hidden;
            height: 100%;
        }

        .card-neon:hover {
            transform: translateY(-8px);
            border-color: rgba(0, 229, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 40px rgba(0, 229, 255, 0.05);
        }

        .card-neon .card-img-top {
            height: 200px;
            object-fit: cover;
            border-bottom: 1px solid rgba(0, 229, 255, 0.05);
        }

        .card-neon .card-body {
            padding: 1.5rem;
        }

        .card-neon .card-title {
            font-weight: 700;
            font-size: 1.1rem;
            color: #e0e8f0;
            line-height: 1.4;
        }

        .card-neon .card-text {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .card-neon .card-footer {
            background: transparent;
            border-top: 1px solid rgba(0, 229, 255, 0.05);
            padding: 1rem 1.5rem;
        }

        .badge-neon {
            background: rgba(0, 229, 255, 0.12);
            color: #00e5ff;
            border: 1px solid rgba(0, 229, 255, 0.15);
            padding: 4px 14px;
            border-radius: 20px;
            font-weight: 500;
            font-size: 0.75rem;
        }

        .badge-category {
            background: rgba(124, 58, 237, 0.15);
            color: #a78bfa;
            border: 1px solid rgba(124, 58, 237, 0.15);
            padding: 4px 14px;
            border-radius: 20px;
            font-weight: 500;
            font-size: 0.75rem;
        }

        /* ===== КАТЕГОРИИ ===== */
        .category-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .category-pill {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.6);
            padding: 8px 24px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .category-pill:hover {
            background: rgba(0, 229, 255, 0.08);
            border-color: #00e5ff;
            color: #00e5ff;
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.05);
        }

        .category-pill.active {
            background: rgba(0, 229, 255, 0.12);
            border-color: #00e5ff;
            color: #00e5ff;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.1);
        }

        /* ===== ПОДВАЛ ===== */
        .footer {
            background: rgba(10, 14, 30, 0.5);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(0, 229, 255, 0.05);
            padding: 3rem 0;
            margin-top: 4rem;
        }

        .footer a {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer a:hover {
            color: #00e5ff;
        }

        /* ===== ХЕДЕР ===== */
        .page-header {
            text-align: center;
            padding: 2rem 0 1rem;
        }

        .page-header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00e5ff, #7c3aed);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }

        .page-header p {
            color: rgba(255, 255, 255, 0.4);
            font-size: 1.1rem;
        }

        /* ===== АНИМАЦИЯ ПОЯВЛЕНИЯ ===== */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeInUp 0.6s ease forwards;
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 768px) {
            .page-header h1 { font-size: 2rem; }
            .card-neon .card-img-top { height: 160px; }
        }

        /* ===== СКРОЛЛБАР ===== */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0e1a;
        }

        ::-webkit-scrollbar-thumb {
            background: #00e5ff;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #7c3aed;
        }
    </style>
</head>
<body>

<!-- ===== ЗВЁЗДЫ ===== -->
<div class="stars" id="stars"></div>

<script>
    (function generateStars() {
        const container = document.getElementById('stars');
        const count = 300;
        for (let i = 0; i < count; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (Math.random() * 5 + 2) + 's');
            star.style.animationDelay = (Math.random() * 6) + 's';
            container.appendChild(star);
        }
    })();
</script>

<!-- ===== НАВИГАЦИЯ ===== -->
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="{% url 'main:index' %}">
            <i class="bi bi-newspaper"></i>NewsHub
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center gap-2">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'main:index' %}">
                        <i class="bi bi-house-door me-1"></i>Главная
                    </a>
                </li>
                {% if user.is_authenticated %}
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="bi bi-person-circle me-1"></i>{{ user.username }}
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-neon" href="{% url 'users:logout' %}">
                            <i class="bi bi-box-arrow-right me-1"></i>Выйти
                        </a>
                    </li>
                {% else %}
                    <li class="nav-item">
                        <a class="btn btn-neon-outline" href="{% url 'users:login' %}">
                            <i class="bi bi-box-arrow-in-right me-1"></i>Войти
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-neon" href="{% url 'users:register' %}">
                            <i class="bi bi-person-plus me-1"></i>Регистрация
                        </a>
                    </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>

<!-- ===== ОСНОВНОЙ КОНТЕНТ ===== -->
<main class="container py-4">
    {% block content %}
    {% endblock %}
</main>

<!-- ===== ПОДВАЛ ===== -->
<footer class="footer">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-6 text-center text-md-start">
                <p class="mb-0 text-white-50 small">
                    <i class="bi bi-newspaper me-1 text-primary"></i>
                    NewsHub — агрегатор новостей
                </p>
            </div>
            <div class="col-md-6 text-center text-md-end">
                <p class="mb-0 text-white-50 small">
                    <i class="bi bi-code-slash me-1"></i>
                    Сделано с
                    <i class="bi bi-heart-fill text-danger mx-1"></i>
                    для разработчиков
                </p>
            </div>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
